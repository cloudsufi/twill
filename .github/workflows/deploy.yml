name: Deploy Twill
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: k8s-runner-build

    strategy:
      fail-fast: false
      matrix:
        branch: [ oss-exit-gate ]

    steps:
      - name: Recursively Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          path: twill
          ref: ${{ matrix.branch }}

      - name: Cache
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ github.workflow }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ github.workflow }}

      - name: Submit Build to GCB
        id: gcb
        working-directory: twill
        run: |
          gcloud builds submit . \
            --config=cloudbuild.yaml \
            --project='cdapio-github-builds'
        # Continue on error to allow the next step (dumping logs) to run
        continue-on-error: true

      - name: Dump gcloud logs if build failed
        if: failure()
        run: |
          echo "--- Dumping gcloud logs for detailed error ---"
          # The exact path from the error: /home/runner/.config/gcloud/logs/2025.10.30/06.03.23.662269.log
          LOG_FILE="/home/runner/.config/gcloud/logs/2025.10.30/06.03.23.662269.log"
          if [ -f "$LOG_FILE" ]; then
            cat "$LOG_FILE"
          else
            echo "Gcloud log file not found at $LOG_FILE"
            # List parent directories to debug if needed
            ls -R /home/runner/.config/gcloud/logs/
          fi
          echo "--- End of gcloud logs ---"

