name: Deploy Twill
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: cdapio-hub-k8-runner

    strategy:
      fail-fast: false
      matrix:
        branch: [ oss-exit-gate ]

    steps:
      - name: Recursively Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          path: twill
          ref: ${{ matrix.branch }}

      - name: Cache
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ github.workflow }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ github.workflow }}

      - name: Get Maven Project Version
        id: get_version
        working-directory: twill
        run: |
          MVN_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$MVN_VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected Maven version: $MVN_VERSION"

      - name: Submit Build to GCB
        id: gcb
        working-directory: twill
        run: |
          echo "Submitting build for version ${{ steps.get_version.outputs.version }} to Cloud Build..."
          gcloud builds submit . \
            --config=cloudbuild.yaml \
            --project='cdapio-github-builds' \
            --substitutions="_MVN_VERSION=${{ steps.get_version.outputs.version }}"
