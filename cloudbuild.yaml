steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    id: fetch-gpg-key
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        # Fetch GPG Private Key to a file in /workspace. This method is good for multi-line/binary secrets.
        gcloud secrets versions access latest --secret=CDAP_GPG_PRIVATE_KEY --format='get(payload.data)' | tr '_-' '/+' | base64 -d > /workspace/gpg_private.key
        echo "GPG Private Key fetched."

  # 1. Setup GPG Environment
  - name: 'gcr.io/cloud-builders/mvn:3.8-jdk-8'
    id: setup-gpg
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        mkdir -p ~/.gnupg
        echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
        echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
        gpg --import --batch /workspace/gpg_private.key
        echo "GPG key imported."
    waitFor: ['fetch-gpg-key']

  # 2. Setup Maven settings.xml to use Secret Manager variables for Sonatype
  - name: 'bash'
    id: setup-maven-settings
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        # Create .m2 directory within /workspace to ensure persistence across steps.
        mkdir -p /workspace/.m2
        cat <<EOF > /workspace/.m2/settings.xml
        <settings>
          <servers>
            <server>
              <id>sonatype.release</id>
              <username>\$${env.CDAP_OSSRH_USERNAME}</username>
              <password>\$${env.CDAP_OSSRH_PASSWORD}</password>
            </server>
          </servers>
        </settings>
        EOF
    # Inject secrets so they can be used in the settings.xml template
    secretEnv:
      - 'CDAP_OSSRH_USERNAME'
      - 'CDAP_OSSRH_PASSWORD'
      - 'CDAP_GPG_PASSPHRASE'
    waitFor: ['setup-gpg']

  # 3. Determine if it's a SNAPSHOT or RELEASE build
  - name: 'ubuntu'
    id: determine-deploy
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Assuming _MVN_VERSION is passed as a build argument
        MVN_VERSION="${_MVN_VERSION}"
        if [[ "$${MVN_VERSION}" == *-SNAPSHOT ]]; then
          echo "IS_SNAPSHOT=true" >> "$$BUILDER_OUTPUT/env"
          echo "Detected SNAPSHOT version: $${MVN_VERSION}"
        else
          echo "IS_SNAPSHOT=false" >> "$$BUILDER_OUTPUT/env"
          echo "Detected RELEASE version: $${MVN_VERSION}"
        fi

  # 4. Conditional Maven Deploy (using mvn deploy)
  - name: 'gcr.io/cloud-builders/mvn:3.8-jdk-8'
    id: conditional-deploy
    entrypoint: 'bash'
    # Inject secrets from availableSecrets as environment variables for this step
    secretEnv:
      - 'CDAP_OSSRH_USERNAME'
      - 'CDAP_OSSRH_PASSWORD'
      - 'CDAP_GPG_PASSPHRASE'
    args:
      - '-c'
      - |
        MVN_COMMAND="mvn deploy -B -V \
          -s /workspace/.m2/settings.xml \
          -P hadoop-2.6 \
          -DskipTests \
          -Drat.skip=true \
          -Dgpg.passphrase="$${CDAP_GPG_PASSPHRASE}" \
          -Dremoteresources.skip=true \
          -Dmaven.wagon.http.google.EffectiveVersion=1.0.1"
        
        if [[ "$$_DETERMINE_DEPLOY_IS_SNAPSHOT" == "false" ]]; then
        MVN_COMMAND+=" -P release-to-artifact-registry"
        fi
        $${MVN_COMMAND}
    waitFor: ['determine-deploy']

  # 5. Create Exit Gate Manifest (ONLY for RELEASE)
  - name: 'bash'
    id: create-exit-gate-manifest
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Correctly access the output variable from determine-deploy using $$_STEP_ID_KEY
        if [[ "$$_DETERMINE_DEPLOY_IS_SNAPSHOT" == "false" ]]; then
          set -e
          MANIFEST_FILE="/workspace/exit_gate_manifest.textproto"
          echo '# -*- protobuffer -*-' > "$${MANIFEST_FILE}"
          echo '# proto-file: security/opensource/exit_gate_v1/onboarded/proto/publishing_manifest.proto' >> "$${MANIFEST_FILE}"
          echo '# proto-message: PublishingManifest' >> "$${MANIFEST_FILE}"
          echo '' >> "$${MANIFEST_FILE}"
          echo 'publish_all: true' >> "$${MANIFEST_FILE}"
          echo "Created manifest file: $${MANIFEST_FILE}"
        else
          echo "Skipping Exit Gate manifest creation for SNAPSHOT build."
        fi
    waitFor: ['conditional-deploy']

  # 6. Upload Exit Gate Manifest (ONLY for RELEASE)
  - name: 'gcr.io/cloud-builders/gsutil'
    id: upload-exit-gate-manifest
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Correctly access the output variable from determine-deploy using $$_STEP_ID_KEY
        if [[ "$$_DETERMINE_DEPLOY_IS_SNAPSHOT" == "false" ]]; then
          set -e
          GCS_MANIFEST_DIR="gs://oss-exit-gate-prod-projects-bucket/cloud-data-fusion/mavencentral/manifests/"
          MANIFEST_FILE="/workspace/exit_gate_manifest.textproto"
          MANIFEST_FILENAME="release_$$(date -u +%Y%m%d%H%M%S).textproto"
          echo "Uploading manifest to $${GCS_MANIFEST_DIR}$${MANIFEST_FILENAME}"
          gsutil cp "$${MANIFEST_FILE}" "$${GCS_MANIFEST_DIR}$${MANIFEST_FILENAME}"
          echo "Manifest uploaded successfully. OSS Exit Gate process should now be triggered."
        else
          echo "Skipping Exit Gate manifest upload for SNAPSHOT build."
        fi
    waitFor: ['create-exit-gate-manifest']

options:
  machineType: 'E2_HIGHCPU_32'

# Define secrets to be fetched from Secret Manager and injected as environment variables
availableSecrets:
  secretManager:
    - versionName: projects/cdapio-github-builds/secrets/CDAP_OSSRH_USERNAME/versions/latest
      env: 'CDAP_OSSRH_USERNAME'
    - versionName: projects/cdapio-github-builds/secrets/CDAP_OSSRH_PASSWORD/versions/latest
      env: 'CDAP_OSSRH_PASSWORD'
    - versionName: projects/cdapio-github-builds/secrets/CDAP_GPG_PASSPHRASE/versions/latest
      env: 'CDAP_GPG_PASSPHRASE'
