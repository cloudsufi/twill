steps:
  # 0. Fetch All Necessary Secrets
  - name: 'gcr.io/cloud-builders/gcloud'
    id: fetch-all-secrets
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        # Fetch GPG Private Key to a file in /workspace
        gcloud secrets versions access latest --secret=CDAP_GPG_PRIVATE_KEY --format='get(payload.data)' | tr '_-' '/+' | base64 -d > /workspace/gpg_private.key
        echo "GPG Private Key fetched."

        # Fetch Sonatype Credentials and GPG Passphrase and export to BUILDER_OUTPUT/env
        echo "CDAP_OSSRH_USERNAME=$(gcloud secrets versions access latest --secret=CDAP_OSSRH_USERNAME)" >> "$$BUILDER_OUTPUT/env"
        echo "CDAP_OSSRH_PASSWORD=$(gcloud secrets versions access latest --secret=CDAP_OSSRH_PASSWORD)" >> "$$BUILDER_OUTPUT/env"
        echo "CDAP_GPG_PASSPHRAS=$(gcloud secrets versions access latest --secret=CDAP_GPG_PASSPHRASE)" >> "$$BUILDER_OUTPUT/env"
        echo "All secrets fetched and exported."

  # 1. Setup GPG Environment
  - name: 'gcr.io/cloud-builders/mvn:3.8-jdk-8'
    id: setup-gpg
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        mkdir -p ~/.gnupg
        echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
        echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
        gpg --import --batch /workspace/gpg_private.key
        echo "GPG key imported."
    waitFor: ['fetch-all-secrets']

  # 2. Determine if it's a SNAPSHOT or RELEASE build
  - name: 'ubuntu'
    id: determine-deploy
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        MVN_VERSION="${_MVN_VERSION}"
        if [[ "$${MVN_VERSION}" == *-SNAPSHOT ]]; then
          echo "IS_SNAPSHOT=true" >> "$$BUILDER_OUTPUT/env"
          echo "Detected SNAPSHOT version: $${MVN_VERSION}"
        else
          echo "IS_SNAPSHOT=false" >> "$$BUILDER_OUTPUT/env"
          echo "Detected RELEASE version: $${MVN_VERSION}"
        fi
    waitFor: ['setup-gpg']

  # 3. Conditional Deploy Step: Handles both SNAPSHOT and RELEASE mvn deploy
  - name: 'gcr.io/cloud-builders/mvn:3.8-jdk-8'
    id: conditional-deploy
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        IS_SNAPSHOT="$$_DETERMINE_DEPLOY_IS_SNAPSHOT"
        GPG_PASSPHRAS="$$_FETCH_ALL_SECRETS_CDAP_GPG_PASSPHRASE"

        if [[ "$${IS_SNAPSHOT}" == "true" ]]; then
          # Run mvn deploy for SNAPSHOT. The central-publishing-maven-plugin will use settings.xml.
          mvn deploy -B -V \
            -DskipTests \
            -Dgpg.passphrase="$${GPG_PASSPHRAS}" \
            -Dremoteresources.skip=true
        else
          # Run the original mvn deploy command for RELEASE to Artifact Registry
          mvn deploy -B -V \
            -DskipTests \
            -P hadoop-2.6 \
            -Drat.skip=true \
            -Dremoteresources.skip=true \
            -Dmaven.wagon.http.google.EffectiveVersion=1.0.1
        fi
    waitFor: ['determine-deploy']

  # 4. Create Exit Gate Manifest (ONLY for RELEASE)
  - name: 'bash'
    id: create-exit-gate-manifest
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [[ "$$_DETERMINE_DEPLOY_IS_SNAPSHOT" == "false" ]]; then
          set -e
          MANIFEST_FILE="/workspace/exit_gate_manifest.textproto"
          echo '# -*- protobuffer -*-' > "$${MANIFEST_FILE}"
          echo '# proto-file: security/opensource/exit_gate_v1/onboarded/proto/publishing_manifest.proto' >> "$${MANIFEST_FILE}"
          echo '# proto-message: PublishingManifest' >> "$${MANIFEST_FILE}"
          echo '' >> "$${MANIFEST_FILE}"
          echo 'publish_all: true' >> "$${MANIFEST_FILE}"
          echo "Created manifest file: $${MANIFEST_FILE}"
        else
          echo "Skipping Exit Gate manifest creation for SNAPSHOT build."
        fi
    waitFor: ['conditional-deploy']

  # 5. Upload Exit Gate Manifest (ONLY for RELEASE)
  - name: 'gcr.io/cloud-builders/gsutil'
    id: upload-exit-gate-manifest
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [[ "$$(steps.determine-deploy.env.IS_SNAPSHOT)" == "false" ]]; then
          set -e
          GCS_MANIFEST_DIR="gs://oss-exit-gate-prod-projects-bucket/cloud-data-fusion/mavencentral/manifests/"
          MANIFEST_FILE="/workspace/exit_gate_manifest.textproto"
          MANIFEST_FILENAME="release_$$(date -u +%Y%m%d%H%M%S).textproto"
          echo "Uploading manifest to $${GCS_MANIFEST_DIR}$${MANIFEST_FILENAME}"
          gsutil cp "$${MANIFEST_FILE}" "$${GCS_MANIFEST_DIR}$${MANIFEST_FILENAME}"
          echo "Manifest uploaded successfully. OSS Exit Gate process should now be triggered."
        else
          echo "Skipping Exit Gate manifest upload for SNAPSHOT build."
        fi
    waitFor: ['create-exit-gate-manifest']

options:
  machineType: 'E2_HIGHCPU_32'
