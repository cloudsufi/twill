steps:
  - name: 'gcr.io/cloud-builders/mvn:3.8-jdk-8'
    id: conditional-deploy
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        DEPLOY_TYPE="${_DEPLOY_TYPE}"
        GPG_PASSPHRAS="${_GPG_PASSPHRAS}"

        if [[ "$${DEPLOY_TYPE}" == "SNAPSHOT" ]]; then
          OSSRH_USERNAME="${_SONATYPE_USERNAME}"
          OSSRH_PASSWORD="${_SONATYPE_PASSWORD}"

          # Create settings.xml for Sonatype Central plugin
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>sonatype.release</id> <!-- Matches <publishingServerId> in pom.xml -->
                <username>$${OSSRH_USERNAME}</username>
                <password>$${OSSRH_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

          # Run mvn deploy for SNAPSHOT. Use maven-gpg-plugin version 3.2.4+
          mvn deploy -B -V -X \
            -DskipTests \
            -Dgpg.passphrase="$${GPG_PASSPHRAS}" \
            -Dremoteresources.skip=true
          echo "SNAPSHOT deployment to Sonatype complete."
        elif [[ "$${DEPLOY_TYPE}" == "RELEASE" ]]; then
          # Run the original mvn deploy command for RELEASE to Artifact Registry
          mvn deploy -B -V -X \
            -DskipTests \
            -P hadoop-2.6 \
            -Drat.skip=true \
            -Dremoteresources.skip=true \
            -Dmaven.wagon.http.google.EffectiveVersion=1.0.1 \
            -Dgpg.passphrase="$${GPG_PASSPHRAS}"
          echo "RELEASE deployment to Artifact Registry complete."
        fi

  # 4. Create Exit Gate Manifest (ONLY for RELEASE)
  - name: 'bash'
    id: create-exit-gate-manifest
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [[ "${_DEPLOY_TYPE}" == "RELEASE"]]; then
          set -e
          MANIFEST_FILE="/workspace/exit_gate_manifest.textproto"
          echo '# -*- protobuffer -*-' > "$${MANIFEST_FILE}"
          echo '# proto-file: security/opensource/exit_gate_v1/onboarded/proto/publishing_manifest.proto' >> "$${MANIFEST_FILE}"
          echo '# proto-message: PublishingManifest' >> "$${MANIFEST_FILE}"
          echo '' >> "$${MANIFEST_FILE}"
          echo 'publish_all: true' >> "$${MANIFEST_FILE}"
          echo "Created manifest file: $${MANIFEST_FILE}"
        else
          echo "Skipping Exit Gate manifest creation for SNAPSHOT build."
        fi
    waitFor: ['conditional-deploy']

  # 5. Upload Exit Gate Manifest (ONLY for RELEASE)
  - name: 'gcr.io/cloud-builders/gsutil'
    id: upload-exit-gate-manifest
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [[ "${_DEPLOY_TYPE}" == "RELEASE" ]]; then
          set -e
          GCS_MANIFEST_DIR="gs://oss-exit-gate-prod-projects-bucket/cloud-data-fusion/mavencentral/manifests/"
          MANIFEST_FILE="/workspace/exit_gate_manifest.textproto"
          MANIFEST_FILENAME="release_$$(date -u +%Y%m%d%H%M%S).textproto"
          echo "Uploading manifest to $${GCS_MANIFEST_DIR}$${MANIFEST_FILENAME}"
          gsutil cp "$${MANIFEST_FILE}" "$${GCS_MANIFEST_DIR}$${MANIFEST_FILENAME}"
          echo "Manifest uploaded successfully. OSS Exit Gate process should now be triggered."
        else
          echo "Skipping Exit Gate manifest upload for SNAPSHOT build."
        fi
    waitFor: ['create-exit-gate-manifest']

options:
  machineType: 'E2_HIGHCPU_32'
